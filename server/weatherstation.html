<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, height=480, initial-scale=1, user-scalable=no">
<title>Weather Station</title>
<style>
  @font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('/assets/inter-400.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:500;font-display:swap;src:url('/assets/inter-500.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url('/assets/inter-600.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('/assets/inter-700.woff2') format('woff2');}
  :root{--bg:#08080a;--fg:#f4f4f6;--sec:#76767e;--dim:#4a4a52;
    --hair:rgba(255,255,255,.08);--card:rgba(255,255,255,.045);--accent:#54c7ff;--uiscale:1;}
  body.light{--bg:#f6f6f7;--fg:#101013;--sec:#86868c;--dim:#b0b0b6;
    --hair:rgba(0,0,0,.09);--card:rgba(0,0,0,.04);--accent:#0a84ff;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:800px;height:480px;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    user-select:none;cursor:none;letter-spacing:-.01em;transition:background .5s ease,color .5s ease;}
  svg{display:block;}
  .lbl{font-size:15px;font-weight:600;letter-spacing:2.5px;color:var(--sec);text-transform:uppercase;}
  /* pinned top bar */
  #top{position:fixed;top:0;left:0;width:800px;height:54px;z-index:50;background:var(--bg);
    display:flex;align-items:center;justify-content:flex-end;padding:0 30px;border-bottom:1px solid transparent;}
  body.ovl #top{border-bottom-color:var(--hair);}
  body:not(.ovl) #top{display:none;}                 /* no empty bar / border on the home page */
  body.ovl #home{visibility:hidden;}                 /* don't bleed the big home clock through overlays */
  #top .ttime{display:flex;align-items:center;}
  #top .tdate{font-size:18px;color:var(--sec);font-weight:600;letter-spacing:.5px;margin-right:18px;}
  #top #tClock{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;}
  #top #tAp{font-size:14px;color:var(--sec);font-weight:600;margin-left:5px;}
  /* HOME */
  #home{position:absolute;inset:0;padding-top:18px;display:flex;flex-direction:column;}
  .hmain{flex:1;min-height:0;display:flex;align-items:center;padding:0 40px;gap:30px;}
  .hleft{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-start;padding-top:6px;}
  #hClock{font-size:calc(124px * var(--uiscale));font-weight:600;line-height:.9;letter-spacing:-5px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  #hClock .ap{font-size:calc(42px * var(--uiscale));color:var(--sec);font-weight:500;margin-left:10px;letter-spacing:-1px;}
  #hDate{font-size:calc(27px * var(--uiscale));font-weight:600;letter-spacing:1.5px;color:var(--sec);text-transform:uppercase;margin-top:8px;}
  .hwx{display:flex;flex-direction:column;align-items:flex-start;text-align:left;margin-top:24px;}
  .hwx-top{display:flex;align-items:center;gap:16px;}
  .hwx-top .ic{font-size:calc(66px * var(--uiscale));line-height:1;}
  .hwx-temp{font-size:calc(74px * var(--uiscale));font-weight:600;letter-spacing:-3px;line-height:1;}
  .hwx-desc{font-size:calc(21px * var(--uiscale));font-weight:500;color:var(--fg);margin-top:4px;}
  .hwx-hl{font-size:calc(18px * var(--uiscale));font-weight:600;color:var(--sec);margin-top:8px;letter-spacing:1px;font-variant-numeric:tabular-nums;}
  .hwx-hl b{color:var(--fg);}
  .hwx-indoor{display:flex;align-items:baseline;gap:12px;margin-top:14px;}
  .hwx-indoor .lbl{font-size:calc(18px * var(--uiscale));}
  .hwx-indoor .v{font-size:calc(60px * var(--uiscale));font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;}
  /* analog clock (right) */
  .hright{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:300px;}
  #aclock{width:292px;height:292px;}
  .hourly{flex:0 0 auto;display:flex;gap:1px;padding:0 28px 16px;}
  .hcell{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 2px;}
  .hcell .ht{font-size:15px;color:var(--sec);font-weight:600;letter-spacing:.5px;}
  .hcell .ic{font-size:32px;color:var(--fg);}
  .hcell .hd{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;}
  /* views */
  .view{position:fixed;inset:0;padding-top:54px;background:var(--bg);z-index:30;
    opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s;}
  .view.show{opacity:1;visibility:visible;}
  .vclose{position:absolute;top:64px;right:26px;z-index:5;font-size:16px;font-weight:600;letter-spacing:1px;
    text-transform:uppercase;color:var(--sec);background:var(--card);border-radius:10px;padding:11px 20px;}
  .vtitle{font-size:18px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--sec);padding:18px 34px 8px;}
  .vbody{height:calc(100% - 54px);overflow-y:auto;padding:4px 34px 24px;scrollbar-width:none;}
  .vbody::-webkit-scrollbar{display:none;}
  .drow{display:flex;align-items:center;gap:22px;padding:15px 4px;border-bottom:1px solid var(--hair);}
  .drow .dw{font-size:22px;font-weight:600;letter-spacing:1px;text-transform:uppercase;width:120px;color:var(--fg);}
  .drow .di{font-size:34px;color:var(--fg);}
  .drow .dr{margin-left:auto;font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;}
  .drow .dr .lo{color:var(--sec);margin-left:16px;}
  /* hourly graph */
  #graph .vbody{display:flex;flex-direction:column;}
  #gWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0 16px;}
  #gSvg{width:100%;height:auto;}
  .hcell{cursor:pointer;}
  /* mood / flash light */
  #light{position:fixed;inset:0;z-index:60;display:none;}
  #light.show{display:block;}
  #lightFill{position:absolute;inset:0;transition:background .15s linear;}
  #lightPanel{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;
    gap:14px;align-items:center;background:rgba(18,18,20,.72);border-radius:22px;padding:16px 22px;}
  #lightSw{display:flex;gap:13px;}
  .sw{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.45);transition:transform .12s;}
  .sw.on{border-color:#fff;transform:scale(1.14);}
  #lightPanel .row{display:flex;align-items:center;gap:14px;width:600px;}
  #lightPanel .row .lbl{color:#fff;}
  #lBar{flex:1;height:30px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden;}
  #lFill{height:100%;width:100%;background:#fff;}
  #lClose{color:#fff;background:rgba(255,255,255,.22);border-radius:11px;padding:10px 20px;font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
  /* settings */
  .srow{display:flex;flex-direction:column;gap:14px;padding:20px 2px;border-bottom:1px solid var(--hair);}
  .seg{display:flex;background:var(--card);border-radius:13px;padding:5px;gap:5px;width:max-content;}
  .seg button{background:none;color:var(--fg);border:none;font-size:21px;font-weight:600;
    padding:13px 30px;border-radius:9px;font-family:inherit;}
  .seg button.on{background:var(--accent);color:#fff;}
  .khi{outline:2px solid var(--accent);outline-offset:3px;}
  .bwrap{display:flex;align-items:center;gap:14px;}
  .bbtn{background:var(--card);border:none;color:var(--fg);font-size:28px;font-weight:600;
    width:60px;height:54px;border-radius:12px;font-family:inherit;flex:0 0 auto;}
  .slider{flex:1;height:36px;background:var(--card);border-radius:10px;overflow:hidden;}
  .bfill{height:100%;width:70%;background:var(--fg);border-radius:10px;}
  .slider.active{outline:2px solid #ff9f0a;outline-offset:3px;}
  .slider.active .bfill{background:#ff9f0a;}
  .about{font-size:17px;color:var(--sec);line-height:1.6;padding:16px 2px;letter-spacing:.3px;}
  /* location keyboard */
  .qbox{font-size:24px;background:var(--card);border-radius:12px;padding:14px 20px;font-weight:500;margin:6px 2px 12px;}
  #locResults .res{font-size:23px;padding:15px 14px;border-radius:11px;font-weight:500;}
  #locResults .res:active{background:var(--card);}
  .krow{display:flex;gap:7px;justify-content:center;margin-bottom:7px;}
  .key{flex:1;background:var(--card);border-radius:10px;font-size:24px;font-weight:600;color:var(--fg);
    padding:14px 0;text-align:center;font-family:inherit;}
  .key:active{background:var(--hair);}
  .key.wide{flex:2.4;}
  button:active,.res:active{transform:scale(.98);}
  /* Morning bird card — the bird BirdNET is hearing, shown in the open space between
     the weather block (left) and the analog clock (right), with a small bird image. */
  .birdcard{position:absolute;left:266px;top:172px;z-index:6;width:184px;
    display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
    padding:11px 14px 13px;border-radius:16px;
    background:rgba(48,209,88,0.10);border:1px solid rgba(48,209,88,0.26);}
  .birdcard[hidden]{display:none;}
  .bc-txt{font-size:16px;font-weight:600;color:#8fe3ad;line-height:1.18;}
  .bc-txt .note{margin-right:5px;display:inline-block;animation:bnote 1.6s ease-in-out infinite;}
  .bc-img{width:100%;display:flex;align-items:center;justify-content:center;color:#34c759;line-height:0;}
  #birdPhoto{width:156px;height:94px;object-fit:cover;border-radius:12px;display:none;}
  #birdFallback{width:76px;height:auto;display:block;}
  body.light .bc-txt{color:#1f8a44;}
  @keyframes bnote{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  /* Bluetooth status glyph — top-right corner, iPhone status-bar style */
  #btStatus{position:fixed;top:13px;right:14px;z-index:60;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;transition:opacity .3s ease;}
  #btStatus svg{width:22px;height:22px;}
  #btStatus.on{opacity:1;color:var(--accent);}
  #btStatus.off{opacity:.5;color:var(--dim);}
  #btStatus .slash{display:none;}
  #btStatus.off .slash{display:block;}
  body.ovl #top{padding-right:52px;}   /* keep the overlay clock clear of the BT glyph */
  /* pull-to-refresh pill */
  #ptr{position:fixed;top:6px;left:50%;transform:translate(-50%,0);background:var(--card);color:var(--fg);
    padding:10px 20px;border-radius:22px;opacity:0;z-index:99998;transition:opacity .15s;font-size:16px;
    pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.4);}
</style>
</head>
<body>
<div id="btStatus" class="off" title="Bluetooth">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 6.5 L17.5 17.5 L12 23 L12 1 L17.5 6.5 L6.5 17.5"/>
    <line class="slash" x1="3" y1="21" x2="21" y2="3" stroke="var(--dim)"/>
  </svg>
</div>
<div id="top">
  <div class="place"></div>
  <div class="ttime"><span class="tdate" id="tDate">—</span><span id="tClock">--:--</span><span id="tAp"></span></div>
</div>

<div id="home">
  <div class="hmain">
    <div class="hleft">
      <div id="hClock">--:--</div>
      <div id="hDate">—</div>
      <div class="hwx">
        <div class="hwx-top"><span class="ic" id="cwIcon"></span><span class="hwx-temp" id="cwTemp">--&deg;</span></div>
        <div class="hwx-desc" id="cwDesc">Connecting</div>
        <div class="hwx-hl" id="cwHL"></div>
        <div class="hwx-indoor"><span class="lbl">Indoor</span><span class="v" id="cwIndoor">--&deg;</span></div>
      </div>
    </div>
    <div class="hright">
      <svg id="aclock" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="97" fill="none" stroke="var(--hair)" stroke-width="1.5"/>
        <g id="acTicks"></g>
        <line id="acHour" x1="100" y1="100" x2="100" y2="54" stroke="var(--fg)" stroke-width="6" stroke-linecap="round"/>
        <line id="acMin" x1="100" y1="100" x2="100" y2="34" stroke="var(--fg)" stroke-width="4" stroke-linecap="round"/>
        <line id="acSec" x1="100" y1="113" x2="100" y2="28" stroke="#ff453a" stroke-width="2" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="5.5" fill="var(--fg)"/>
        <circle cx="100" cy="100" r="2.6" fill="#ff453a"/>
      </svg>
    </div>
  </div>
  <div class="birdcard" id="birdBanner" hidden>
    <div class="bc-txt"><span class="note">&#9834;</span><span id="birdText"></span></div>
    <div class="bc-img">
      <img id="birdPhoto" alt="">
      <svg id="birdFallback" viewBox="0 0 64 50" fill="none">
        <polygon points="6,20 25,26 21,35" fill="currentColor"/>
        <ellipse cx="34" cy="27" rx="18" ry="13" fill="currentColor"/>
        <circle cx="48" cy="18" r="8" fill="currentColor"/>
        <polygon points="56,16 64,19 56,22" fill="#ffb020"/>
        <ellipse cx="31" cy="28" rx="9" ry="6" fill="rgba(0,0,0,.18)"/>
        <circle cx="50" cy="16" r="1.8" fill="#0c1a12"/>
        <line x1="33" y1="39" x2="33" y2="46" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        <line x1="40" y1="39" x2="40" y2="46" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
  <div class="hourly" id="hourly"></div>
</div>

<div id="forecast" class="view">
  <div class="vclose" onclick="closeView('forecast')">Back</div>
  <div class="vtitle">7-Day Forecast</div>
  <div class="vbody" id="fcBody">Loading…</div>
</div>

<div id="loc" class="view">
  <div class="vclose" onclick="closeView('loc')">Back</div>
  <div class="vtitle">Location</div>
  <div class="vbody">
    <div class="qbox" id="qbox">Type a city…</div>
    <div id="locResults"></div>
    <div id="kb"></div>
  </div>
</div>

<div id="settings" class="view">
  <div class="vclose" onclick="closeView('settings')">Back</div>
  <div class="vtitle">Settings</div>
  <div class="vbody">
    <div class="srow"><span class="lbl">Units</span>
      <div class="seg"><button onclick="setUnit('C')" data-u="C">&deg;C</button><button onclick="setUnit('F')" data-u="F">&deg;F</button></div></div>
    <div class="srow"><span class="lbl">Location</span>
      <div class="seg"><button onclick="openView('loc')">Change city</button></div></div>
    <div class="srow"><span class="lbl">Appearance</span>
      <div class="seg"><button onclick="setTheme('auto')" data-th="auto">Auto</button><button onclick="setTheme('dark')" data-th="dark">Dark</button><button onclick="setTheme('light')" data-th="light">Light</button></div>
      <div class="about" id="thHint" style="padding:2px 0 0"></div></div>
    <div class="srow"><span class="lbl">Text Size <span id="tsPct" style="color:var(--fg);font-weight:600;letter-spacing:0"></span></span>
      <div class="bwrap"><button class="bbtn" onclick="scaleStep(-1)">&minus;</button>
        <button class="bbtn" onclick="scaleStep(1)">+</button>
        <button class="bbtn" style="width:auto;padding:13px 20px;font-size:19px" onclick="setScale(1)">Reset</button></div></div>
    <div class="srow"><span class="lbl">Brightness <span id="bpct" style="color:var(--fg);font-weight:600;letter-spacing:0"></span></span>
      <div class="bwrap"><button class="bbtn" id="bAuto" style="width:auto;padding:13px 18px;font-size:20px" onclick="setAuto(!brightAuto)">Auto</button>
        <button class="bbtn" onclick="brightStep(-10)">&minus;</button>
        <div class="slider" id="bbar" onclick="brightTap(event)"><div class="bfill" id="bfill"></div></div>
        <button class="bbtn" onclick="brightStep(10)">+</button></div></div>
    <div class="about" id="about"></div>
  </div>
</div>

<div id="graph" class="view">
  <div class="vclose" onclick="closeView('graph')">Back</div>
  <div class="vtitle">Hourly Forecast</div>
  <div class="vbody"><div id="gWrap"><svg id="gSvg" viewBox="0 0 760 300"></svg></div></div>
</div>

<div id="light">
  <div id="lightFill"></div>
  <div id="lightPanel">
    <div id="lightSw"></div>
    <div class="row"><span class="lbl">Brightness</span><div id="lBar" onclick="lBarTap(event)"><div id="lFill"></div></div>
      <div id="lClose" onclick="closeView('light')">Done</div></div>
  </div>
</div>

<script>
const VERSION="3.4", BR_FLOOR=30;
const CT="http://127.0.0.1:8091";
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FDAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const FMON=['January','February','March','April','May','June','July','August','September','October','November','December'];
// ---- colored weather icons (multi-tone, scale with font-size) ----
const SUN='#ffd60a',CL='#dfe4ec',CLN='#aeb6c2',DROP='#4aa8ff',FLAKE='#ffffff',BOLT='#ffd60a',MOONC='#e6ebf7';
function csvg(inner){return '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';}
const WI={
  clear:csvg('<g stroke="'+SUN+'" stroke-width="1.8"><path d="M12 2.4v2.3M12 19.3v2.3M4.4 4.4 6 6M18 18l1.6 1.6M2.4 12h2.3M19.3 12h2.3M4.4 19.6 6 18M18 6l1.6-1.6"/></g><circle cx="12" cy="12" r="4.4" fill="'+SUN+'" stroke="'+SUN+'" stroke-width="1.8"/>'),
  moon:csvg('<path d="M20 14.3A8 8 0 0 1 9.7 4 8 8 0 1 0 20 14.3Z" fill="'+MOONC+'" stroke="'+MOONC+'" stroke-width="1.4"/>'),
  partly:csvg('<g stroke="'+SUN+'" stroke-width="1.6"><path d="M7.5 2.4v1.7M2.5 7.5h1.7M3.6 3.6 4.8 4.8M12.5 7.5h-1.7M11.4 3.6 10.2 4.8"/></g><circle cx="7.5" cy="7.5" r="2.9" fill="'+SUN+'" stroke="'+SUN+'" stroke-width="1.6"/><path d="M17.5 20H8.2a4.4 4.4 0 1 1 .9-8.7A5.4 5.4 0 0 1 20 13.4 3.2 3.2 0 0 1 17.5 20Z" fill="'+CL+'" stroke="'+CLN+'" stroke-width="1.2"/>'),
  cloud:csvg('<path d="M17.5 18.5H8a5.3 5.3 0 1 1 1.1-10.5A6.3 6.3 0 0 1 20.3 10.6 3.6 3.6 0 0 1 17.5 18.5Z" fill="'+CL+'" stroke="'+CLN+'" stroke-width="1.2"/>'),
  fog:csvg('<path d="M17.5 13.5H8a5.3 5.3 0 1 1 1.1-10.5A6.3 6.3 0 0 1 20.3 5.6 3.6 3.6 0 0 1 17.5 13.5Z" fill="'+CL+'" stroke="'+CLN+'" stroke-width="1.2"/><g stroke="'+CLN+'" stroke-width="1.8"><path d="M5 17.5h11M7 20.5h8"/></g>'),
  drizzle:csvg('<path d="M17.5 14.5H8a5.3 5.3 0 1 1 1.1-10.5A6.3 6.3 0 0 1 20.3 6.6 3.6 3.6 0 0 1 17.5 14.5Z" fill="'+CL+'" stroke="'+CLN+'" stroke-width="1.2"/><g stroke="'+DROP+'" stroke-width="2"><path d="M9 18v1.6M13 18v1.6M17 18v1.6"/></g>'),
  rain:csvg('<path d="M17.5 14H8a5.3 5.3 0 1 1 1.1-10.5A6.3 6.3 0 0 1 20.3 6.1 3.6 3.6 0 0 1 17.5 14Z" fill="'+CL+'" stroke="'+CLN+'" stroke-width="1.2"/><g stroke="'+DROP+'" stroke-width="2"><path d="M9 17.5v3M13 17.5v3M17 17.5v3"/></g>'),
  snow:csvg('<path d="M17.5 14H8a5.3 5.3 0 1 1 1.1-10.5A6.3 6.3 0 0 1 20.3 6.1 3.6 3.6 0 0 1 17.5 14Z" fill="'+CL+'" stroke="'+CLN+'" stroke-width="1.2"/><g stroke="'+FLAKE+'" stroke-width="2.2"><path d="M9 18h.01M9 20.6h.01M13 18.7h.01M13 21.3h.01M17 18h.01M17 20.6h.01"/></g>'),
  storm:csvg('<path d="M17.5 13.5H8a5.3 5.3 0 1 1 1.1-10.5A6.3 6.3 0 0 1 20.3 5.6 3.6 3.6 0 0 1 17.5 13.5Z" fill="'+CLN+'" stroke="#97a0ad" stroke-width="1.2"/><path d="M12.5 12.5 10.2 16.5h3l-2.3 4" fill="none" stroke="'+BOLT+'" stroke-width="2"/>')
};
WI.mclear=WI.clear;
function wicon(key,allowMoon){if(allowMoon&&(key==='clear'||key==='mclear')&&isNight())return WI.moon;return WI[key]||WI.cloud;}
// ---- Pi-authoritative clock ----
let srvOffMs=null,tzOffMin=-(new Date().getTimezoneOffset()),haveTime=false;
function setSrvTime(n,tz){if(n){srvOffMs=n-Date.now();haveTime=true;}if(typeof tz==='number')tzOffMin=tz;}
function nowD(){return new Date((srvOffMs!=null?Date.now()+srvOffMs:Date.now())+tzOffMin*60000);}
function two(n){return String(n).padStart(2,'0');}
let sun={rise:null,set:null};
function nowMin(){const d=nowD();return d.getUTCHours()*60+d.getUTCMinutes();}

  document.getElementById('tClock').textContent=hh+':'+mm;document.getElementById('tAp').textContent=ap;

// ---- Pull-to-refresh (CT touchscreen = USB HID mouse, so native touch scroll never fires) ----
(function(){
  var ptr=document.createElement('div');ptr.id='ptr';ptr.textContent='↻ Release to refresh';
  document.body.appendChild(ptr);
  var down=false,sy=0,el=null,pull=0,moved=0,st=0;
  function scrollableFrom(t){for(;t&&t!==document.body;t=t.parentElement){var s=getComputedStyle(t);
    if((s.overflowY==='auto'||s.overflowY==='scroll')&&t.scrollHeight>t.clientHeight+4)return t;}return null;}
  document.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;
    if(e.target.closest('.slider,#lBar,#bbar,#qbox'))return;
    down=true;sy=e.clientY;moved=0;pull=0;el=scrollableFrom(e.target);st=el?el.scrollTop:0;
    if(el)el.style.scrollBehavior='auto';},true);
  document.addEventListener('pointermove',function(e){if(!down)return;
    var dy=e.clientY-sy;moved=Math.max(moved,Math.abs(dy));
    if(el){el.scrollTop=st-dy;}
    else if(dy>0&&!curOverlay()){pull=dy;
      ptr.style.opacity=Math.min(1,dy/130);ptr.style.transform='translate(-50%,'+Math.min(56,dy/2.4)+'px)';}
  },true);
  function end(){if(pull>130)location.reload();
    if(el)el.style.scrollBehavior='';
    down=false;el=null;pull=0;ptr.style.opacity=0;ptr.style.transform='translate(-50%,0)';}
  document.addEventListener('pointerup',end,true);
  document.addEventListener('pointercancel',end,true);
  document.addEventListener('click',function(e){if(moved>14){e.stopPropagation();e.preventDefault();moved=0;}},true);
})();

function renderGraph(hourly){const sv=document.getElementById('gSvg');hourly=(hourly||[]).slice(0,12);
  if(hourly.length<2){sv.innerHTML='<text x="380" y="150" text-anchor="middle" fill="var(--sec)" font-size="20">No hourly data</text>';return;}
  const W=760,H=300,pL=24,pR=24,pT=48,pB=40,n=hourly.length;
  const temps=hourly.map(h=>+h.temp),mn=Math.min(...temps),mx=Math.max(...temps),rng=(mx-mn)||1;
  const x=i=>pL+i*(W-pL-pR)/(n-1),y=t=>pT+(mx-t)/rng*(H-pT-pB);
  let line='',area='M'+x(0).toFixed(1)+' '+(H-pB),pts='';
  hourly.forEach((h,i)=>{const px=x(i),py=y(+h.temp);line+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)+' ';area+='L'+px.toFixed(1)+' '+py.toFixed(1)+' ';
    pts+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.4" fill="var(--accent)"/>'
       +'<text x="'+px.toFixed(1)+'" y="'+(py-13).toFixed(1)+'" text-anchor="middle" font-size="18" font-weight="600" fill="var(--fg)">'+Math.round(h.temp)+'°</text>'
       +'<text x="'+px.toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="14" font-weight="600" fill="var(--sec)">'+hr12(h.t)+'</text>';});
  area+='L'+x(n-1).toFixed(1)+' '+(H-pB)+' Z';
  sv.innerHTML='<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.32"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#gg)"/><path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+pts;}

document.addEventListener('keydown',(ev)=>{
  const k=ev.key;
  if(k==='m'||k==='M'){if(!ev.repeat)toggleDisplay();return;}
  if(k==='5'){closeAll();return;}          // 5th button = Home
  if(k==='1'){curOverlay()==='forecast'?closeAll():openView('forecast');return;}
  if(k==='2'){toggleTheme();return;}
  if(k==='3'){curOverlay()==='light'?closeAll():openView('light');return;}
  if(k==='4'){curOverlay()==='settings'?closeAll():openView('settings');return;}
  const v=curOverlay();
  if(v==='light'){
    if(k==='ArrowRight'||k==='ArrowDown'){lightSel=(lightSel+1)%LIGHTS.length;buildLightSw();applyLight();}
    else if(k==='ArrowLeft'||k==='ArrowUp'){lightSel=(lightSel-1+LIGHTS.length)%LIGHTS.length;buildLightSw();applyLight();}
    else if(k==='Escape'||k==='Backspace'||k==='Enter')closeView('light');return;}
  if(v==='settings'){
    const o=setOpts()[setSel];const onSlider=o&&o.classList.contains('slider');
    if(onSlider&&sliderActive){
      if(k==='ArrowDown'||k==='ArrowRight'){brightStep(5);return;}
      if(k==='ArrowUp'||k==='ArrowLeft'){brightStep(-5);return;}
      if(k==='Enter'||k==='Escape'||k==='Backspace'){sliderActive=false;o.classList.remove('active');return;}
      return;}
    if(k==='ArrowDown'||k==='ArrowRight')setMove(1);
    else if(k==='ArrowUp'||k==='ArrowLeft')setMove(-1);
    else if(k==='Enter'){if(onSlider){sliderActive=true;o.classList.add('active');}else if(o)o.click();}
    else if(k==='Escape'||k==='Backspace')closeView('settings');
    return;}
  if(v){if(k==='Escape'||k==='Backspace')closeView(v);
    else{const b=document.querySelector('#'+v+' .vbody');if(b){if(k==='ArrowDown')b.scrollBy({top:120});else if(k==='ArrowUp')b.scrollBy({top:-120});}}return;}
  if(k==='Enter')openView('forecast');

<!-- ===== iPhone notification display (ANCS) ==================================
     Self-contained. Patch-time globals set the DEFAULTS:

       window.ANCS_URL    endpoint to poll (gateway, or a same-origin proxy)
       window.ANCS_FS     CSS length for the base font size. Everything else is
                          in em, so pass the host page's OWN scale here and the
                          notification tracks that screen's typography:
                            BirdThing     calc(21px * var(--ts,1))
                            WeatherThing  calc(30px * var(--uiscale,1))
                            kiosk         clamp(1.3rem, 2vw, 1.9rem)
       window.ANCS_STYLE  'toast' | 'full'   default layout
       window.ANCS_THEME  'light' for light pages with no body.light

     The user then overrides size / fullscreen / duration / on-off from the
     host page's own Settings screen - this script INJECTS those rows into
     #settings .vbody at runtime rather than editing the dashboards, so both
     Car Things get the identical panel and stay consistent. Choices live in
     localStorage and apply immediately.

     PERFORMANCE: no backdrop-filter, no infinite animations, opacity-only
     transitions. The Car Things composite in software on an Amlogic GPU while
     their own UI repaints constantly (the WeatherThing redraws an analog clock
     every 200ms) - blur layers and looping transforms made this visibly glitch.
     Canonical source: E:\BirdThing\ancs\notify_widget.html
============================================================================ -->
<style>

  #ancsWrap.full{top:0;bottom:0;padding:0;gap:0;}

    font-size:var(--ancs-fs,21px);
    background:#1c1c1e;color:#f5f5f7;
    border:1px solid rgba(255,255,255,.16);
    opacity:0;transition:opacity .32s ease;}
  .ancs.in{opacity:1;}
  body.light .ancs,.ancs.light{background:#fff;color:#1c1c1e;
    border-color:rgba(0,0,0,.12);}

  /* ---- toast layout ---- */
  .ancs.toast{width:100%;max-width:44em;display:flex;align-items:center;
    gap:.8em;padding:.7em .95em;border-radius:.95em;
    box-shadow:0 .5em 1.6em rgba(0,0,0,.5);}
  .ancs.toast .ancs-ico{flex:0 0 auto;width:2.3em;height:2.3em;
    border-radius:.62em;display:flex;align-items:center;justify-content:center;
    font-size:1.15em;background:rgba(255,255,255,.14);}
  body.light .ancs.toast .ancs-ico,.ancs.toast.light .ancs-ico{
    background:rgba(0,0,0,.07);}
  .ancs.toast .ancs-body{flex:1 1 auto;min-width:0;}
  .ancs.toast .ancs-app{font-size:.62em;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;opacity:.62;margin-bottom:.15em;}
  .ancs.toast .ancs-title{font-size:1.12em;font-weight:600;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
  .ancs.toast .ancs-msg{font-size:.95em;opacity:.8;line-height:1.3;
    margin-top:.12em;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;}
  .ancs.toast.call{border-color:rgba(48,209,88,.6);}
  .ancs.toast.call .ancs-ico{background:rgba(48,209,88,.22);color:#30d158;}

  /* ---- fullscreen layout ---- */
  .ancs.full{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;
    border:0;border-radius:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:1em 1.2em;gap:.35em;
    transition:opacity .9s ease;}   /* fade-out slower than fade-in */
  .ancs.full.in{transition:opacity .3s ease;}
  .ancs.full .ancs-ico{font-size:2.3em;line-height:1;margin-bottom:.15em;}
  .ancs.full .ancs-app{font-size:.62em;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;opacity:.6;}
  .ancs.full .ancs-title{font-size:1.55em;font-weight:700;line-height:1.12;
    max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ancs.full .ancs-msg{font-size:.98em;opacity:.85;line-height:1.28;
    max-width:94%;display:-webkit-box;-webkit-line-clamp:3;
    -webkit-box-orient:vertical;overflow:hidden;}
  .ancs.full.call{background:#06240f;color:#eafff0;}
  .ancs.full.call .ancs-app{color:#30d158;opacity:1;}
  body.light .ancs.full.call,.ancs.full.call.light{background:#e8fbee;
    color:#042c12;}

  /* selected state for the injected settings buttons */
  #settings .ancs-sel{background:var(--accent,#0a84ff)!important;
    color:#fff!important;border-color:transparent!important;}

  @media (prefers-reduced-motion:reduce){.ancs{transition:opacity .15s;}}
</style>
<script>
(function(){
  var URL_ = window.ANCS_URL || '/api/notify';
  var POLL = window.ANCS_POLL_MS || 2500;
  var BASE_FS = window.ANCS_FS || '21px';
  var DEF_FULL = window.ANCS_STYLE === 'full';

  // ---- user settings (host page's Settings screen writes these) ----
  function ls(k, d){ try { var v = localStorage.getItem(k);
    return v === null ? d : v; } catch(e){ return d; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var S = {
    on:    ls('ancsOn','1') === '1',
    scale: parseFloat(ls('ancsScale','1')) || 1,
    full:  ls('ancsFull', DEF_FULL ? '1' : '0') === '1',
    hold:  parseInt(ls('ancsHold','6'), 10) || 6
  };

  var wrap = document.createElement('div');
  wrap.id = 'ancsWrap';
  document.body.appendChild(wrap);

  function applyStyle(){
    wrap.className = S.full ? 'full' : '';
    // the host's own scale variable is inside BASE_FS, so this multiplies the
    // screen's real typography by the user's notification-size preference
    wrap.style.setProperty('--ancs-fs',
      'calc((' + BASE_FS + ') * ' + S.scale + ')');
  }
  applyStyle();

  var seen = Object.create(null);
  var primed = false;
  var queue = [], current = null;

  var GLYPH = {IncomingCall:'\u{1F4DE}', MissedCall:'\u{1F4F5}', Voicemail:'\u{1F4FC}',
    Social:'\u{1F4AC}', Schedule:'\u{1F4C5}', Email:'\u2709\uFE0F', News:'\u{1F4F0}',
    HealthAndFitness:'\u2764\uFE0F', BusinessAndFinance:'\u{1F4B3}',
    Location:'\u{1F4CD}', Entertainment:'\u{1F3AC}', Other:'\u{1F514}'};
  var APP_GLYPH = {Messages:'\u{1F4AC}', WhatsApp:'\u{1F4AC}', Phone:'\u{1F4DE}',
    FaceTime:'\u{1F4F9}', Mail:'\u2709\uFE0F', Gmail:'\u2709\uFE0F',
    Calendar:'\u{1F4C5}', Clock:'\u23F0', Findmy:'\u{1F4CD}', Myq:'\u{1F6AA}'};
  function glyph(n){ return APP_GLYPH[n.app] || GLYPH[n.cat] || GLYPH.Other; }

  function build(n, full){
    var el = document.createElement('div');
    el.className = 'ancs ' + (full ? 'full' : 'toast')
      + (n.call ? ' call' : '')
      + (window.ANCS_THEME === 'light' ? ' light' : '');
    var who = n.title || n.app || 'Notification';
    var sub = (n.subtitle && n.subtitle !== who) ? n.subtitle : '';
    var msg = n.call ? (n.message || sub || 'Incoming call')
                     : (n.message || sub || '');
    el.innerHTML = '<div class="ancs-ico"></div><div class="ancs-body">'
      + '<div class="ancs-app"></div><div class="ancs-title"></div>'
      + (msg ? '<div class="ancs-msg"></div>' : '') + '</div>';
    if (full) {   // fullscreen centres the parts directly, no inner column
      var b = el.querySelector('.ancs-body');
      while (b.firstChild) el.insertBefore(b.firstChild, b);
      el.removeChild(b);
    }
    // textContent everywhere - notification text is untrusted, never innerHTML
    el.querySelector('.ancs-ico').textContent = glyph(n);
    el.querySelector('.ancs-app').textContent =
      n.call ? 'Incoming call' : (n.app || '');
    el.querySelector('.ancs-title').textContent = who;
    if (msg) el.querySelector('.ancs-msg').textContent = msg;
    el.addEventListener('click', function(){ dismiss(n.uid); });
    return el;
  }

  function dismiss(uid){
    var rec = seen[uid];
    if (!rec || !rec.el) return;
    if (rec.timer) { clearTimeout(rec.timer); rec.timer = null; }
    var el = rec.el, wasFull = rec.full;
    rec.el = null;
    if (current === uid) current = null;
    el.classList.remove('in');
    setTimeout(function(){
      if (el.parentNode) el.parentNode.removeChild(el);
      if (wasFull) next();
    }, 950);
  }

  function present(n){
    var full = S.full;
    var el = build(n, full);
    wrap.appendChild(el);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ el.classList.add('in'); });
    });
    var rec = seen[n.uid] || (seen[n.uid] = {});
    rec.el = el; rec.full = full;
    if (full) current = n.uid;
    var ms = (n.call ? Math.max(S.hold, 20) : S.hold) * 1000;
    rec.timer = setTimeout(function(){ dismiss(n.uid); }, ms);
  }

  function next(){
    if (current !== null || !queue.length) return;
    present(queue.shift());
  }
  function show(n){
    if (!S.on) { seen[n.uid] = {seeded:true}; return; }
    if (S.full) { queue.push(n); next(); } else present(n);
  }

  function update(n){
    var rec = seen[n.uid];
    if (!rec || !rec.el) return;
    var t = rec.el.querySelector('.ancs-title');
    if (t && n.title && t.textContent !== n.title) t.textContent = n.title;
    var m = rec.el.querySelector('.ancs-msg');
    if (m && n.message && m.textContent !== n.message) m.textContent = n.message;
  }

  function tick(){
    fetch(URL_, {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.items) return;
        var live = Object.create(null);
        d.items.forEach(function(n){ live[n.uid] = n; });
        d.items.forEach(function(n){
          if (!primed) { seen[n.uid] = {seeded:true}; return; }
          var rec = seen[n.uid];
          if (!rec) {
            if (n.fresh && n.active !== false) { seen[n.uid] = {}; show(n); }
            else seen[n.uid] = {seeded:true};
          } else if (rec.el) {
            if (n.active === false) dismiss(n.uid); else update(n);
          }
        });
        Object.keys(seen).forEach(function(uid){
          if (seen[uid].el && !live[uid]) dismiss(uid);
        });
        primed = true;
      })
      .catch(function(){});
  }

  // ---------------- settings rows, injected into the host's panel ----------
  function injectSettings(){
    var body = document.querySelector('#settings .vbody');
    if (!body || document.getElementById('ancsSet')) return;

    // the two dashboards use different class names for the same thing
    var labelCls = body.querySelector('.sk') ? 'sk' : 'lbl';
    var segCls   = body.querySelector('.seg2') ? 'seg2' : 'seg';

    function row(label, extraId){
      var d = document.createElement('div');
      d.className = 'srow';
      d.innerHTML = '<span class="' + labelCls + '"></span>';
      d.firstChild.textContent = label;
      if (extraId) {
        var s = document.createElement('span');
        s.id = extraId;
        s.style.cssText = 'color:var(--sec,#888);font-weight:600;'
          + 'letter-spacing:0;margin-left:6px';
        d.firstChild.appendChild(s);
      }
      return d;
    }
    function seg(buttons){
      var g = document.createElement('div');
      g.className = segCls;
      buttons.forEach(function(b){
        var el = document.createElement('button');
        el.textContent = b[0];
        el.onclick = b[1];
        if (b[2]) el.dataset.ancs = b[2];
        g.appendChild(el);
      });
      return g;
    }

    var wrapEl = document.createElement('div');
    wrapEl.id = 'ancsSet';

    var head = row('Phone notifications');
    head.appendChild(seg([
      ['On',  function(){ S.on = true;  lsSet('ancsOn','1'); mark(); }, 'on1'],
      ['Off', function(){ S.on = false; lsSet('ancsOn','0'); mark(); }, 'on0']
    ]));
    wrapEl.appendChild(head);

    var sz = row('Notification size', 'ancsPct');
    var bw = document.createElement('div');
    bw.className = 'bwrap';
    [['\u2212', function(){ setScale(S.scale - 0.1); }],
     ['+',      function(){ setScale(S.scale + 0.1); }],
     ['Reset',  function(){ setScale(1); }]].forEach(function(b, i){
      var el = document.createElement('button');
      el.className = 'bbtn';
      el.textContent = b[0];
      el.onclick = b[1];
      if (i === 2) el.style.cssText = 'width:auto;padding:13px 20px';
      bw.appendChild(el);
    });
    sz.appendChild(bw);
    wrapEl.appendChild(sz);

    var fs = row('Full screen');
    fs.appendChild(seg([
      ['On',  function(){ S.full = true;  lsSet('ancsFull','1'); applyStyle(); mark(); }, 'f1'],
      ['Off', function(){ S.full = false; lsSet('ancsFull','0'); applyStyle(); mark(); }, 'f0']
    ]));
    var hint = document.createElement('span');
    hint.className = 'about';
    hint.style.cssText = 'padding:4px 4px 0';
    hint.textContent = 'On: the alert takes over the whole screen, then fades '
      + 'away. Off: a banner across the top.';
    fs.appendChild(hint);
    wrapEl.appendChild(fs);

    var hd = row('Show for', 'ancsSec');
    var hb = document.createElement('div');
    hb.className = 'bwrap';
    [['\u2212', function(){ setHold(S.hold - 2); }],
     ['+',      function(){ setHold(S.hold + 2); }]].forEach(function(b){
      var el = document.createElement('button');
      el.className = 'bbtn';
      el.textContent = b[0];
      el.onclick = b[1];
      hb.appendChild(el);
    });
    hd.appendChild(hb);
    wrapEl.appendChild(hd);

    body.appendChild(wrapEl);
    mark();
  }

  function setScale(v){
    S.scale = Math.max(0.6, Math.min(3, Math.round(v * 10) / 10));
    lsSet('ancsScale', S.scale); applyStyle(); mark();
  }
  function setHold(v){
    S.hold = Math.max(2, Math.min(30, v));
    lsSet('ancsHold', S.hold); mark();
  }
  function mark(){
    var p = document.getElementById('ancsPct');
    if (p) p.textContent = Math.round(S.scale * 100) + '%';
    var s = document.getElementById('ancsSec');
    if (s) s.textContent = S.hold + 's';
    var q = document.querySelectorAll('#ancsSet button[data-ancs]');
    Array.prototype.forEach.call(q, function(b){
      var k = b.dataset.ancs;
      var on = (k === 'on1' && S.on) || (k === 'on0' && !S.on)
            || (k === 'f1' && S.full) || (k === 'f0' && !S.full);
      b.classList.toggle('ancs-sel', on);
    });
  }

  // the settings view may not exist yet at load; retry briefly, then watch
  var tries = 0;
  var iv = setInterval(function(){
    injectSettings();
    if (document.getElementById('ancsSet') || ++tries > 40) clearInterval(iv);
  }, 250);

  tick();
  setInterval(tick, POLL);
})();
</script>
<!-- ===== end iPhone notification display ==================================== -->
<!-- ANCS-NOTIFY-END -->
</body>
</html>
